<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LawAI hammer favicon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3158c6"/>
      <stop offset="100%" stop-color="#253f9c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>
  <circle cx="16" cy="14" r="20" fill="url(#shine)"/>

  <!-- Hammer icon -->
  <g transform="rotate(-35 32 32)" fill="#ffffff">
    <!-- Hammer head -->
    <rect x="17" y="17" width="24" height="9" rx="2.4"/>
    <!-- Claw -->
    <path d="M39 17h8.5c1 0 1.8.9 1.8 1.9v1.9c0 1-.8 1.8-1.8 1.8h-8.5z"/>
    <!-- Neck -->
    <rect x="28.5" y="24.5" width="6" height="5.2" rx="1.2" opacity="0.95"/>
    <!-- Handle -->
    <rect x="29.2" y="28.5" width="4.6" height="19" rx="2.2"/>
    <!-- Grip -->
    <rect x="28.4" y="45.4" width="6.2" height="3.8" rx="1.9" opacity="0.9"/>
  </g>
</svg>
